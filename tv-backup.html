<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask a Question, backup QR slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Public+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, #24473a 0%, #1d3a2d 55%, #142921 100%);
    color: #f2eee2;
    font-family: "Public Sans", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 4vh 2rem;
    gap: 3.2vh;
  }
  .eyebrow {
    font-size: clamp(.8rem, 1.6vw, 1.15rem);
    font-weight: 600; letter-spacing: .28em; text-transform: uppercase;
    color: #c9b070;
  }
  h1 {
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 5.5vw, 4.2rem);
    line-height: 1.1;
  }
  .qrcard {
    background: #ffffff;
    padding: clamp(1rem, 2.2vw, 1.8rem);
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(0,0,0,.35);
  }
  .qrcard img { display: block; width: clamp(220px, 34vh, 420px); height: auto; }
  .url {
    font-size: clamp(1rem, 2.2vw, 1.6rem);
    font-weight: 600; letter-spacing: .02em;
    color: #c9b070;
  }
  .assure { font-size: clamp(.85rem, 1.5vw, 1.1rem); opacity: .8; }
</style>
</head>
<body>
  <div class="eyebrow">An Evening with the Bishopric</div>
  <h1>Questions are closed</h1>
</body>
</html>
