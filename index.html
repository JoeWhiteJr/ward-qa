<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Bishopric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #24271f;
    --green: #1d3a2d;
    --green-deep: #142921;
    --gold: #a8862f;
    --gold-soft: #c9b070;
    --ribbon: #8c2f39;
    --muted: #6e6f64;
    --line: #ddd6c4;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.25rem 3rem;
  }
  main { width: 100%; max-width: 34rem; }
  .plate { text-align: center; margin-bottom: 2rem; }
  .eyebrow {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .rule {
    width: 5.5rem; margin: .9rem auto;
    border: 0; border-top: 1px solid var(--gold-soft);
    position: relative;
  }
  .rule::after {
    content: ""; position: absolute; left: 0; right: 0; top: 3px;
    border-top: 1px solid var(--gold-soft);
  }
  h1 {
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 6vw, 2.5rem);
    line-height: 1.15;
    color: var(--green);
  }
  .lede { margin-top: .8rem; color: var(--muted); font-size: .95rem; line-height: 1.5; }
  form, .done {
    background: #fffdf8;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.5rem;
    box-shadow: 0 1px 2px rgba(29,58,45,.06), 0 8px 24px rgba(29,58,45,.05);
  }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .55rem; color: var(--green); }
  textarea {
    width: 100%;
    min-height: 8.5rem;
    resize: vertical;
    font: 1.05rem/1.55 "EB Garamond", Georgia, serif;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: .85rem .95rem;
  }
  textarea:focus, button:focus-visible, .again:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: .5rem; }
  .count { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--ribbon); font-weight: 600; }
  .hp { position: absolute; left: -6000px; top: -6000px; }
  button {
    margin-top: 1.1rem;
    width: 100%;
    padding: .95rem 1rem;
    font: 600 1rem "Public Sans", system-ui, sans-serif;
    color: #fdfbf5;
    background: var(--green);
    border: 0; border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease;
  }
  button:hover { background: var(--green-deep); }
  button:disabled { opacity: .55; cursor: default; }
  .assure {
    margin-top: .9rem;
    text-align: center;
    font-size: .82rem;
    color: var(--muted);
  }
  .error { margin-top: .8rem; font-size: .88rem; color: var(--ribbon); display: none; }
  .done { display: none; text-align: center; padding: 2.2rem 1.5rem; }
  .seal {
    width: 3.4rem; height: 3.4rem; margin: 0 auto 1rem;
    border: 1px solid var(--gold-soft); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-size: 1.4rem;
  }
  .done h2 { font-family: "EB Garamond", Georgia, serif; font-weight: 600; color: var(--green); font-size: 1.6rem; }
  .done p { margin-top: .6rem; color: var(--muted); font-size: .95rem; line-height: 1.5; }
  .again {
    display: inline-block; margin-top: 1.3rem;
    font-size: .9rem; font-weight: 600; color: var(--green);
    text-decoration: underline; text-underline-offset: 3px;
    background: none; border: 0; cursor: pointer; width: auto; padding: .3rem .4rem;
  }
  footer { margin-top: auto; padding-top: 2.5rem; font-size: .75rem; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .done.show { animation: rise .35s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main>
  <div class="plate">
    <div class="eyebrow">An Evening with the Bishopric</div>
    <hr class="rule">
    <h1>Ask the Bishopric</h1>
    <p class="lede">Questions are closed. Thank you to everyone who asked.</p>
  </div>

</main>
<footer>Ward Question Box</footer>

</body>
</html>
